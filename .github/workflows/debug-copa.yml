name: debug-copa
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - env:
          NFG_USER: ${{ secrets.NFG_USER }}
          NFG_PASS: ${{ secrets.NFG_PASS }}
        run: node scraper/debug-copa.js
      - run: |
          git config user.name "sporting-maderasa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scraper/debug-copa-now-*.html
          git commit -m "debug copa" && git push
