name: Borrar un amistoso concreto (uso único)

on:
  workflow_dispatch:
    inputs:
      opponent:
        description: 'Texto que debe contener el nombre del rival a borrar'
        required: true
        default: 'Betis'

jobs:
  cleanup-one:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Borrar el amistoso
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          OPPONENT_MATCH: ${{ github.event.inputs.opponent }}
        run: node scraper/cleanup-one-match.js
